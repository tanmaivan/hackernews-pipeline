name: hn-pipeline
prefect-version: 3.4.20

build: null
push: null

pull:
  - prefect.deployments.steps.git_clone:
      id: clone-step
      repository: https://github.com/tanmaivan/hackernews-api-pipeline.git
      branch: main
  - prefect.deployments.steps.pip_install_requirements:
      directory: "{{ clone-step.directory }}"
      requirements_file: orchestration/requirements.txt

deployments:
  - name: extractor_deployment
    entrypoint: orchestration/extractor_flow.py:extractor_flow
    work_pool:
      name: data_pipeline_pool
    schedules:
      - cron: 0 0 * * *
        timezone: UTC
        day_or: true
        active: true

  - name: bronze_to_silver_deployment
    entrypoint: orchestration/bronze_to_silver_flow.py:bronze_to_silver_flow
    work_pool:
      name: data_pipeline_pool
    schedules:
      - cron: 0 1 * * *
        timezone: UTC
        day_or: true
        active: true

  - name: silver_to_gold_deployment
    entrypoint: orchestration/silver_to_gold_flow.py:run_dbt
    work_pool:
      name: data_pipeline_pool
    schedules:
      - cron: 0 2 * * *
        timezone: UTC
        day_or: true
        active: true
